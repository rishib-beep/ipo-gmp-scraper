name: IPO GMP Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: ipo-gmp-scraper
  cancel-in-progress: false

jobs:
  scrape:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # 2. Setup Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # ============================================================
      # 3. Install Python packages
      # ============================================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          pip install playwright
          pip install gspread
          pip install google-auth
          pip install google-auth-oauthlib
          pip install google-auth-httplib2

      # ============================================================
      # 4. Install Chromium
      # ============================================================
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      # ============================================================
      # 5. Run IPO GMP scraper
      # ============================================================
      - name: Run IPO GMP scraper
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python ipo_gmp_scraper.py

      # ============================================================
      # 6. Check generated files
      # ============================================================
      - name: Check generated files
        run: |
          echo "Files changed by scraper:"
          git status --short

          echo ""
          echo "Repository files:"
          ls -lah

      # ============================================================
      # 7. Commit and push CSV
      # ============================================================
      - name: Commit updated CSV
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Make sure we are working with the latest remote main branch
          git fetch origin main

          # Rebase our generated changes on top of latest main
          git pull --rebase origin main

          # Add CSV/data files
          git add .

          # Check whether anything changed
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Commit
          git commit -m "Update IPO GMP data"

          # Push
          git push origin HEAD:main
