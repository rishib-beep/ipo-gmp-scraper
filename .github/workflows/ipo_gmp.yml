
name: IPO GMP Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run IPO GMP scraper
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          echo "Starting IPO GMP scraper..."
          python ipo_gmp_scraper.py
          echo "Scraper completed."

      - name: Verify result CSV
        run: |
          if [ ! -f "ipo_gmp_result.csv" ]; then
            echo "ERROR: ipo_gmp_result.csv not found"
            exit 1
          fi

          echo "ipo_gmp_result.csv exists"
          ls -lh ipo_gmp_result.csv
          wc -l ipo_gmp_result.csv
          echo "First 10 lines:"
          head -10 ipo_gmp_result.csv

      - name: Verify history CSV
        run: |
          if [ ! -f "ipo_gmp_history.csv" ]; then
            echo "ERROR: ipo_gmp_history.csv not found"
            exit 1
          fi

          echo "ipo_gmp_history.csv exists"
          ls -lh ipo_gmp_history.csv
          wc -l ipo_gmp_history.csv
          echo "First 10 lines:"
          head -10 ipo_gmp_history.csv

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage CSV files
        run: |
          git add ipo_gmp_result.csv
          git add ipo_gmp_history.csv

          echo "Staged files:"
          git diff --cached --name-only

      - name: Check for changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No CSV changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "CSV changes detected."
          fi

      - name: Commit CSV files
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit -m "Update IPO GMP data"

      - name: Synchronize with main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

      - name: Final verification
        run: |
          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          echo ""
          echo "Result CSV:"
          ls -lh ipo_gmp_result.csv

          echo ""
          echo "History CSV:"
          ls -lh ipo_gmp_history.csv

          echo ""
          echo "Latest commit:"
          git log -1 --oneline

          echo ""
          echo "IPO GMP scraper completed successfully."

