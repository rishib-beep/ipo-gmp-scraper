```yaml
name: IPO GMP Scraper

on:
  workflow_dispatch:

  schedule:
    # 09:15 AM IST
    - cron: "45 3 * * 1-5"

    # 09:45 AM IST
    - cron: "15 4 * * 1-5"

    # 10:15 AM IST
    - cron: "45 4 * * 1-5"

    # 10:45 AM IST
    - cron: "15 5 * * 1-5"

    # 11:15 AM IST
    - cron: "45 5 * * 1-5"

    # 11:45 AM IST
    - cron: "15 6 * * 1-5"

    # 12:15 PM IST
    - cron: "45 6 * * 1-5"

    # 12:45 PM IST
    - cron: "15 7 * * 1-5"

    # 01:15 PM IST
    - cron: "45 7 * * 1-5"

    # 01:45 PM IST
    - cron: "15 8 * * 1-5"

    # 02:15 PM IST
    - cron: "45 8 * * 1-5"

    # 02:45 PM IST
    - cron: "15 9 * * 1-5"

    # 03:15 PM IST
    - cron: "45 9 * * 1-5"

    # 03:30 PM IST
    - cron: "0 10 * * 1-5"


permissions:
  contents: write


concurrency:
  group: ipo-gmp-scraper
  cancel-in-progress: false


jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium


      - name: Run IPO GMP scraper
        run: |
          echo "=========================================="
          echo "IPO GMP SCRAPER"
          echo "=========================================="

          echo ""
          echo "Python version:"
          python --version

          echo ""
          echo "UTC time:"
          date -u

          echo ""
          echo "IST time:"
          TZ=Asia/Kolkata date

          echo ""
          echo "Running scraper..."

          python ipo_gmp_scraper.py

          echo ""
          echo "Scraper completed."


      - name: Verify result CSV
        run: |
          echo "=========================================="
          echo "VERIFY RESULT CSV"
          echo "=========================================="

          if [ ! -f "ipo_gmp_result.csv" ]; then
            echo "ERROR: ipo_gmp_result.csv not found"
            exit 1
          fi

          if [ ! -s "ipo_gmp_result.csv" ]; then
            echo "ERROR: ipo_gmp_result.csv is empty"
            exit 1
          fi

          echo ""
          echo "Result CSV:"
          ls -lh ipo_gmp_result.csv

          echo ""
          echo "Rows:"
          wc -l ipo_gmp_result.csv

          echo ""
          echo "Data:"
          head -10 ipo_gmp_result.csv


      - name: Verify history CSV
        run: |
          echo "=========================================="
          echo "VERIFY HISTORY CSV"
          echo "=========================================="

          if [ ! -f "ipo_gmp_history.csv" ]; then
            echo "ERROR: ipo_gmp_history.csv not found"
            exit 1
          fi

          if [ ! -s "ipo_gmp_history.csv" ]; then
            echo "ERROR: ipo_gmp_history.csv is empty"
            exit 1
          fi

          echo ""
          echo "History CSV:"
          ls -lh ipo_gmp_history.csv

          echo ""
          echo "Rows:"
          wc -l ipo_gmp_history.csv

          echo ""
          echo "Latest records:"
          head -10 ipo_gmp_history.csv


      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      - name: Stage CSV files
        run: |
          git add ipo_gmp_result.csv
          git add ipo_gmp_history.csv

          echo "=========================================="
          echo "STAGED FILES"
          echo "=========================================="

          git diff --cached --name-only


      - name: Check for changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No CSV changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "CSV changes detected."
            git diff --cached --stat
          fi


      - name: Commit CSV files
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit -m "Update IPO GMP data"


      - name: Synchronize with main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch origin main
          git rebase origin/main


      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin HEAD:main


      - name: Final verification
        run: |
          echo ""
          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          echo ""
          echo "Current IST time:"
          TZ=Asia/Kolkata date

          echo ""
          echo "Result CSV:"
          ls -lh ipo_gmp_result.csv

          echo ""
          echo "History CSV:"
          ls -lh ipo_gmp_history.csv

          echo ""
          echo "Latest commit:"
          git log -1 --oneline

          echo ""
          echo "=========================================="
          echo "IPO GMP SCRAPER COMPLETED SUCCESSFULLY"
          echo "=========================================="
```
