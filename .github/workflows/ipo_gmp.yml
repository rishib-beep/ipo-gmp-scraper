name: IPO GMP Scraper

on:

  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: ipo-gmp-scraper
  cancel-in-progress: false

jobs:

  scrape:

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v5

        with:
          fetch-depth: 0


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"
          cache: "pip"


      # ========================================================
      # INSTALL PACKAGES
      # ========================================================

      - name: Install Python packages
        run: |

          python -m pip install --upgrade pip

          pip install pandas
          pip install playwright
          pip install gspread
          pip install google-auth
          pip install google-auth-oauthlib
          pip install google-auth-httplib2


      # ========================================================
      # PLAYWRIGHT
      # ========================================================

      - name: Install Playwright Chromium
        run: |

          python -m playwright install --with-deps chromium


      # ========================================================
      # RUN SCRAPER
      # ========================================================

      - name: Run IPO GMP scraper
        run: |

          python ipo_gmp_scraper.py


      # ========================================================
      # SHOW RESULT
      # ========================================================

      - name: Check generated CSV
        run: |

          echo "========================================"
          echo "CSV FILE"
          echo "========================================"

          ls -lh ipo_gmp_result.csv

          echo ""

          echo "========================================"
          echo "FIRST 10 ROWS"
          echo "========================================"

          head -10 ipo_gmp_result.csv


      # ========================================================
      # COMMIT CSV
      # ========================================================

      - name: Commit and push CSV
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Get latest remote branch
          git fetch origin main

          # Reset local branch to latest remote
          git reset --soft origin/main

          # Add generated CSV
          git add ipo_gmp_result.csv

          # Check changes
          if git diff --cached --quiet; then

            echo "No CSV changes."

          else

            git commit \
              -m "Update IPO GMP data"

            git push origin HEAD:main

          fi
