name: IPO GMP Scraper

on:

  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"


# Prevent two scraper runs from pushing at the same time
concurrency:
  group: ipo-gmp-scraper
  cancel-in-progress: false


permissions:
  contents: write


jobs:

  scrape:

    name: Scrape IPO GMP

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v5

        with:

          fetch-depth: 0

          ref: main


      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"

          cache: "pip"


      # ======================================================
      # 3. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # 4. INSTALL PLAYWRIGHT
      # ======================================================

      - name: Install Playwright Chromium

        run: |

          python -m playwright install --with-deps chromium


      # ======================================================
      # 5. RUN SCRAPER
      # ======================================================

      - name: Run IPO GMP scraper

        run: |

          python ipo_gmp_scraper.py


      # ======================================================
      # 6. SHOW GENERATED FILES
      # ======================================================

      - name: Show generated files

        run: |

          echo "======================================"

          echo "Generated CSV files"

          echo "======================================"

          ls -lh *.csv || true

          echo ""

          echo "Current CSV rows:"

          if [ -f ipo_gmp_result.csv ]; then
            wc -l ipo_gmp_result.csv
          fi

          echo ""

          echo "History CSV rows:"

          if [ -f ipo_gmp_history.csv ]; then
            wc -l ipo_gmp_history.csv
          fi


      # ======================================================
      # 7. COMMIT AND PUSH
      # ======================================================

      - name: Commit and push updated data

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          # Get the latest remote changes
          git fetch origin main


          # Rebase our work on the latest main
          git rebase origin/main


          # Add CSV files only
          git add ipo_gmp_result.csv

          git add ipo_gmp_history.csv


          # Check whether anything changed
          if git diff --cached --quiet; then

            echo "No CSV changes."

          else

            git commit \
              -m "Update IPO GMP data"


            git push origin HEAD:main

          fi
