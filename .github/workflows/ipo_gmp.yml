name: IPO GMP Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  scrape:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout repository
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      # =====================================================
      # 2. Setup Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # =====================================================
      # 3. Install dependencies
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # =====================================================
      # 4. Run scraper
      # =====================================================

      - name: Run IPO GMP scraper
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          echo "Starting IPO GMP scraper..."
          python ipo_gmp_scraper.py
          echo "Scraper completed."

      # =====================================================
      # 5. Show generated files
      # =====================================================

      - name: Check generated files
        run: |
          echo "Repository files:"
          ls -lah

          echo ""
          echo "CSV files:"
          ls -lah *.csv 2>/dev/null || true

          echo ""
          echo "History file:"
          if [ -f ipo_gmp_history.csv ]; then
            echo "ipo_gmp_history.csv EXISTS"
            wc -l ipo_gmp_history.csv
            head -5 ipo_gmp_history.csv
          else
            echo "ipo_gmp_history.csv NOT FOUND"
          fi

          echo ""
          echo "Result file:"
          if [ -f ipo_gmp_result.csv ]; then
            echo "ipo_gmp_result.csv EXISTS"
            wc -l ipo_gmp_result.csv
            head -5 ipo_gmp_result.csv
          else
            echo "ipo_gmp_result.csv NOT FOUND"
          fi

      # =====================================================
      # 6. Commit generated CSV files
      # =====================================================

      - name: Commit CSV files
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking Git status..."

          git status --short

          # Add only generated data files
          git add ipo_gmp_result.csv
          git add ipo_gmp_history.csv

          echo "Staged changes:"
          git diff --cached --stat

          # -------------------------------------------------
          # Nothing changed
          # -------------------------------------------------

          if git diff --cached --quiet; then

            echo "No CSV changes detected."
            exit 0

          fi

          # -------------------------------------------------
          # Commit changes
          # -------------------------------------------------

          git commit -m "Update IPO GMP data"

      # =====================================================
      # 7. Push safely
      # =====================================================

      - name: Push changes
        run: |

          echo "Fetching latest main branch..."

          git fetch origin main

          echo "Synchronizing local branch..."

          git merge --no-edit origin/main || true

          echo "Pushing generated data..."

          git push origin HEAD:main
