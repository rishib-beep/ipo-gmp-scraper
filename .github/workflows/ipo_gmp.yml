```yaml
name: IPO GMP Scraper

on:

  # Manual run
  workflow_dispatch:

  # Every 30 minutes
  schedule:
    - cron: "*/30 * * * *"


# Required for committing CSV files
permissions:
  contents: write


jobs:

  scrape:

    runs-on: ubuntu-latest


    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository

        uses: actions/checkout@v5

        with:

          fetch-depth: 0

          # Prevent checkout from becoming detached
          persist-credentials: true


      # =====================================================
      # 2. SETUP PYTHON
      # =====================================================

      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"

          cache: "pip"


      # =====================================================
      # 3. INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # =====================================================
      # 4. INSTALL PLAYWRIGHT
      # =====================================================

      - name: Install Playwright Chromium

        run: |

          python -m playwright install --with-deps chromium


      # =====================================================
      # 5. RUN SCRAPER
      # =====================================================

      - name: Run IPO GMP scraper

        run: |

          python ipo_gmp_scraper.py


      # =====================================================
      # 6. CHECK OUTPUT
      # =====================================================

      - name: Check generated files

        run: |

          echo "======================================"

          echo "Repository files:"

          ls -lah

          echo "======================================"

          echo "CSV files:"

          find . -maxdepth 2 -type f \
            -name "*.csv" \
            -print

          echo "======================================"

          if [ ! -f "ipo_gmp_result.csv" ]; then

            echo "ERROR: ipo_gmp_result.csv was not created."

            exit 1

          fi

          if [ ! -f "ipo_gmp_history.csv" ]; then

            echo "WARNING: ipo_gmp_history.csv was not created."

            echo "Creating empty history file."

            echo "IPO Name,GMP Numeric,GMP %,Data Date,Data Time,Last Updated" \
              > ipo_gmp_history.csv

          fi


      # =====================================================
      # 7. SYNC WITH REMOTE
      # =====================================================

      - name: Sync with latest main branch

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          git checkout main

          git pull --rebase origin main


      # =====================================================
      # 8. COMMIT CSV FILES
      # =====================================================

      - name: Commit updated CSV files

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add ipo_gmp_result.csv

          git add ipo_gmp_history.csv

          if git diff --cached --quiet; then

            echo "No CSV changes."

          else

            git commit \
              -m "Update IPO GMP data"

            git push origin main

          fi
```
