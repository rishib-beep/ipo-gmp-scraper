name: IPO GMP Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: ipo-gmp-scraper
  cancel-in-progress: true

jobs:
  scrape:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      # ============================================================
      # 3. INSTALL PYTHON DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas
            pip install playwright
            pip install gspread
            pip install google-auth
            pip install google-auth-oauthlib
            pip install google-auth-httplib2
          fi


      # ============================================================
      # 4. INSTALL PLAYWRIGHT CHROMIUM
      # ============================================================

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium


      # ============================================================
      # 5. SHOW REPOSITORY FILES
      # ============================================================

      - name: Check repository
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          ls -lah

          echo ""
          echo "Python files:"
          find . -maxdepth 2 -type f -name "*.py" -print

          echo ""
          echo "CSV files:"
          find . -maxdepth 2 -type f -name "*.csv" -print


      # ============================================================
      # 6. CHECK SCRAPER FILE
      # ============================================================

      - name: Check scraper
        run: |
          if [ ! -f "ipo_gmp_scraper.py" ]; then
            echo "ERROR: ipo_gmp_scraper.py not found."
            echo ""
            echo "The scraper must be located at:"
            echo "ipo-gmp-scraper/ipo_gmp_scraper.py"
            exit 1
          fi

          echo "ipo_gmp_scraper.py found."


      # ============================================================
      # 7. RUN IPO GMP SCRAPER
      # ============================================================

      - name: Run IPO GMP scraper
        run: |
          echo "Starting IPO GMP scraper..."
          python ipo_gmp_scraper.py


      # ============================================================
      # 8. CHECK SCRAPER OUTPUT
      # ============================================================

      - name: Check scraper output
        run: |

          echo "Files after scraper:"
          ls -lah

          echo ""
          echo "CSV files:"
          find . -maxdepth 2 -type f -name "*.csv" -print

          if [ ! -f "ipo_gmp_result.csv" ]; then
            echo "ERROR: ipo_gmp_result.csv was not created."
            exit 1
          fi

          echo ""
          echo "ipo_gmp_result.csv found."

          echo ""
          echo "First 10 rows:"
          head -n 10 ipo_gmp_result.csv


      # ============================================================
      # 9. CREATE HISTORY FILE IF IT DOES NOT EXIST
      # ============================================================

      - name: Initialize history file
        run: |

          if [ ! -f "ipo_gmp_history.csv" ]; then

            echo "ipo_gmp_history.csv does not exist."

            echo "Creating history file..."

            echo "IPO Name,GMP Numeric,GMP %,Data Date,Data Time,Last Updated" > ipo_gmp_history.csv

          else

            echo "ipo_gmp_history.csv already exists."

          fi


      # ============================================================
      # 10. CHECK HISTORY FILE
      # ============================================================

      - name: Check history file
        run: |

          if [ ! -f "ipo_gmp_history.csv" ]; then
            echo "ERROR: ipo_gmp_history.csv still does not exist."
            exit 1
          fi

          echo "History file:"
          ls -lh ipo_gmp_history.csv

          echo ""
          echo "History rows:"
          wc -l ipo_gmp_history.csv


      # ============================================================
      # 11. CONFIGURE GIT
      # ============================================================

      - name: Configure Git
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ============================================================
      # 12. SYNCHRONIZE WITH MAIN
      # ============================================================

      - name: Synchronize repository
        run: |

          git fetch origin main

          git rebase origin/main


      # ============================================================
      # 13. ADD UPDATED FILES
      # ============================================================

      - name: Add updated files
        run: |

          git add ipo_gmp_result.csv

          git add ipo_gmp_history.csv

          echo "Files staged:"

          git status --short


      # ============================================================
      # 14. COMMIT CHANGES
      # ============================================================

      - name: Commit changes
        run: |

          if git diff --cached --quiet; then

            echo "No IPO GMP changes detected."

          else

            echo "Changes detected."

            git commit -m "Update IPO GMP data"

          fi


      # ============================================================
      # 15. PUSH TO GITHUB
      # ============================================================

      - name: Push changes
        run: |

          git push origin HEAD:main

          echo "IPO GMP data successfully pushed to GitHub."


      # ============================================================
      # 16. FINAL STATUS
      # ============================================================

      - name: Final status
        run: |

          echo ""
          echo "============================================"
          echo "IPO GMP SCRAPER COMPLETED"
          echo "============================================"

          echo ""
          echo "Result CSV:"
          ls -lh ipo_gmp_result.csv

          echo ""
          echo "History CSV:"
          ls -lh ipo_gmp_history.csv

          echo ""
          echo "Repository:"
          git status --short
