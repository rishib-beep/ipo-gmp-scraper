<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>IPO GMP Analysis Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #222;
}

h1 {
    margin: 0 0 5px 0;
    font-size: 28px;
}

.subtitle {
    color: #666;
    margin-bottom: 18px;
}

/* ==============================
   CONTROLS
============================== */

.controls {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 15px;
}

.control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

label {
    font-weight: bold;
    font-size: 14px;
}

select,
input {
    width: 320px;
    padding: 9px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    background: white;
}

/* ==============================
   CHART
============================== */

.chart-box {
    background: white;
    border-radius: 10px;
    padding: 15px 18px 10px 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 18px;
}

.chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
}

.chart-header h2 {
    margin: 0;
    font-size: 19px;
}

.chart-info {
    color: #666;
    font-size: 13px;
}

.chart-container {
    position: relative;
    height: 260px;
    width: 100%;
}

/* ==============================
   STATUS
============================== */

.status {
    background: white;
    padding: 10px 15px;
    border-radius: 7px;
    margin-bottom: 15px;
    color: #555;
    font-size: 14px;
}

/* ==============================
   TABLE
============================== */

.section-title {
    font-size: 20px;
    margin: 15px 0 10px 0;
}

.table-wrapper {
    background: white;
    border-radius: 10px;
    overflow-x: auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1500px;
    font-size: 13px;
}

thead {
    background: #1f2937;
    color: white;
}

th,
td {
    padding: 10px 8px;
    border-bottom: 1px solid #ddd;
    text-align: center;
    white-space: nowrap;
}

th:first-child,
td:first-child {
    text-align: left;
}

tbody tr:hover {
    background: #f1f5f9;
}

.gmp-positive {
    font-weight: bold;
}

.gmp-negative {
    font-weight: bold;
}

/* ==============================
   MOBILE
============================== */

@media(max-width: 700px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 22px;
    }

    select,
    input {
        width: 100%;
    }

    .control-group {
        width: 100%;
    }

    .chart-container {
        height: 220px;
    }

}

</style>

</head>


<body>

<h1>📊 IPO GMP Analysis Dashboard</h1>

<p class="subtitle">
    Live IPO Grey Market Premium & GMP Trend
</p>


<!-- =========================================
     CONTROLS
========================================= -->

<div class="controls">

    <div class="control-group">

        <label for="ipoSelect">
            Select IPO for GMP Trend
        </label>

        <select id="ipoSelect">

            <option value="">
                Loading IPOs...
            </option>

        </select>

    </div>


    <div class="control-group">

        <label for="searchBox">
            Search IPO
        </label>

        <input
            type="text"
            id="searchBox"
            placeholder="Search IPO..."
        >

    </div>

</div>


<!-- =========================================
     GMP CHART
========================================= -->

<div class="chart-box">

    <div class="chart-header">

        <div>

            <h2 id="chartTitle">
                GMP % Trend
            </h2>

            <div class="chart-info">
                X-axis: Date &nbsp; | &nbsp;
                Y-axis: GMP %
            </div>

        </div>

    </div>


    <div class="chart-container">

        <canvas id="gmpChart"></canvas>

    </div>

</div>


<!-- =========================================
     STATUS
========================================= -->

<div
    class="status"
    id="status">

    Loading GMP data...

</div>


<!-- =========================================
     CURRENT IPO TABLE
========================================= -->

<h2 class="section-title">
    Current IPO GMP
</h2>


<div class="table-wrapper">

    <table>

        <thead>

            <tr>

                <th>IPO Name</th>
                <th>GMP</th>
                <th>GMP %</th>
                <th>GMP Down</th>
                <th>GMP Up</th>
                <th>Subscription</th>
                <th>IPO Price</th>
                <th>IPO Size</th>
                <th>Lot Size</th>
                <th>Open</th>
                <th>Close</th>
                <th>BOA Date</th>
                <th>Listing Date</th>
                <th>Updated</th>
                <th>Anchor</th>
                <th>Estimated Listing</th>

            </tr>

        </thead>


        <tbody id="ipoTableBody">

        </tbody>

    </table>

</div>


<script>

/* ============================================================
   CONFIGURATION
============================================================ */

/*
   Put your CSV file in the same GitHub repository.

   Example:

   ipo_gmp_result.csv

   If your CSV is inside output folder, change to:

   output/ipo_gmp_result.csv
*/

const CSV_URL = "ipo_gmp_result.csv";


let ipoData = [];
let gmpChart = null;


/* ============================================================
   CSV PARSER
============================================================ */

function parseCSV(text) {

    const rows = [];

    let row = [];
    let cell = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];

        const next = text[i + 1];

        if (char === '"' && next === '"') {

            cell += '"';

            i++;

        }

        else if (char === '"') {

            insideQuotes = !insideQuotes;

        }

        else if (char === "," && !insideQuotes) {

            row.push(cell.trim());

            cell = "";

        }

        else if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (char === "\r" && next === "\n") {
                i++;
            }

            row.push(cell.trim());

            if (row.some(x => x !== "")) {
                rows.push(row);
            }

            row = [];
            cell = "";

        }

        else {

            cell += char;

        }

    }

    if (cell !== "" || row.length > 0) {

        row.push(cell.trim());

        if (row.some(x => x !== "")) {
            rows.push(row);
        }

    }

    if (rows.length === 0) {
        return [];
    }

    const headers = rows[0];

    return rows.slice(1).map(row => {

        const obj = {};

        headers.forEach((header, index) => {

            obj[header] = row[index] || "";

        });

        return obj;

    });

}


/* ============================================================
   NUMBER EXTRACTION
============================================================ */

function number(value) {

    if (value === null || value === undefined) {
        return NaN;
    }

    const cleaned = String(value)
        .replace(/,/g, "")
        .replace(/[₹%x]/gi, "")
        .trim();

    const match = cleaned.match(/-?\d+(\.\d+)?/);

    if (!match) {
        return NaN;
    }

    return parseFloat(match[0]);

}


/* ============================================================
   FIND COLUMN
============================================================ */

function findColumn(obj, possibleNames) {

    const keys = Object.keys(obj);

    for (const wanted of possibleNames) {

        const found = keys.find(
            key =>
                key.trim().toLowerCase() ===
                wanted.trim().toLowerCase()
        );

        if (found) {
            return found;
        }

    }

    return null;

}


/* ============================================================
   IPO NAME
============================================================ */

function getIPOName(row) {

    const column = findColumn(row, [

        "IPO Name",
        "Name",
        "IPO",
        "Company",
        "IPO_Name"

    ]);

    if (column) {
        return row[column];
    }

    return "";

}


/* ============================================================
   GMP %
============================================================ */

function getGMPPercent(row) {

    const column = findColumn(row, [

        "GMP %",
        "GMP % (Website)",
        "Calculated GMP %",
        "GMP Percentage"

    ]);

    if (column) {

        const value = number(row[column]);

        if (!isNaN(value)) {
            return value;
        }

    }


    /*
       If GMP % is not present,
       calculate it from GMP / IPO Price.
    */

    const gmpColumn = findColumn(row, [

        "GMP",
        "GMP Numeric"

    ]);

    const priceColumn = findColumn(row, [

        "IPO Price",
        "Price",
        "Upper Price"

    ]);


    if (gmpColumn && priceColumn) {

        const gmp = number(row[gmpColumn]);

        const price = number(row[priceColumn]);

        if (
            !isNaN(gmp) &&
            !isNaN(price) &&
            price !== 0
        ) {

            return (gmp / price) * 100;

        }

    }

    return NaN;

}


/* ============================================================
   DATE PARSER
============================================================ */

function parseDate(value) {

    if (!value) {
        return null;
    }

    value = String(value).trim();

    /*
       Try normal JavaScript date
    */

    let date = new Date(value);

    if (!isNaN(date.getTime())) {
        return date;
    }


    /*
       Handle DD-MMM format

       Example:
       27-Aug
    */

    const match = value.match(
        /^(\d{1,2})[-\/]([A-Za-z]{3,9})/
    );

    if (match) {

        const day = parseInt(match[1]);

        const monthName =
            match[2].toLowerCase();

        const months = {

            jan: 0,
            january: 0,

            feb: 1,
            february: 1,

            mar: 2,
            march: 2,

            apr: 3,
            april: 3,

            may: 4,

            jun: 5,
            june: 5,

            jul: 6,
            july: 6,

            aug: 7,
            august: 7,

            sep: 8,
            september: 8,

            oct: 9,
            october: 9,

            nov: 10,
            november: 10,

            dec: 11,
            december: 11

        };

        const month =
            months[monthName];

        if (month !== undefined) {

            const year =
                new Date().getFullYear();

            return new Date(
                year,
                month,
                day
            );

        }

    }

    return null;

}


/* ============================================================
   GET DATE FROM ROW
============================================================ */

function getRowDate(row) {

    const column = findColumn(row, [

        "Date",
        "GMP Date",
        "Updated",
        "Updated-On",
        "Updated On",
        "GMP_Date"

    ]);

    if (column) {

        return parseDate(row[column]);

    }

    return null;

}


/* ============================================================
   LOAD CSV
============================================================ */

async function loadData() {

    try {

        document.getElementById("status")
            .innerText =
            "Loading GMP data...";


        const response =
            await fetch(
                CSV_URL + "?t=" + Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "CSV file could not be loaded"
            );

        }


        const text =
            await response.text();


        ipoData =
            parseCSV(text);


        console.log(
            "Rows loaded:",
            ipoData.length
        );


        if (!ipoData.length) {

            throw new Error(
                "CSV contains no data"
            );

        }


        populateIPOList();

        displayTable();

        setupDefaultChart();


        document.getElementById("status")
            .innerText =
            `${ipoData.length} IPO records loaded successfully.`;

    }

    catch (error) {

        console.error(error);

        document.getElementById("status")
            .innerText =
            "Error loading GMP data: " +
            error.message;

    }

}


/* ============================================================
   POPULATE IPO DROPDOWN
============================================================ */

function populateIPOList() {

    const select =
        document.getElementById("ipoSelect");


    select.innerHTML = "";


    /*
       Get unique IPO names
    */

    const names =
        [...new Set(
            ipoData
                .map(row => getIPOName(row))
                .filter(name => name)
        )];


    /*
       Sort IPOs by latest available date.

       Latest IPO/date comes first.
    */

    names.sort((a, b) => {

        const dateA =
            getLatestDateForIPO(a);

        const dateB =
            getLatestDateForIPO(b);

        return dateB - dateA;

    });


    /*
       Add dropdown options
    */

    names.forEach(name => {

        const option =
            document.createElement("option");

        option.value = name;

        option.textContent = name;

        select.appendChild(option);

    });


    /*
       Select first/latest IPO
    */

    if (names.length > 0) {

        select.value = names[0];

        updateChart(names[0]);

    }


    /*
       Dropdown change
    */

    select.addEventListener(
        "change",
        function() {

            updateChart(this.value);

        }
    );

}


/* ============================================================
   LATEST DATE FOR IPO
============================================================ */

function getLatestDateForIPO(name) {

    const rows =
        ipoData.filter(
            row =>
                getIPOName(row) === name
        );


    let latest = 0;


    rows.forEach(row => {

        const date =
            getRowDate(row);

        if (date) {

            const time =
                date.getTime();

            if (time > latest) {
                latest = time;
            }

        }

    });


    return latest;

}


/* ============================================================
   BUILD GMP TREND
============================================================ */

function getTrendData(ipoName) {

    const rows =
        ipoData.filter(
            row =>
                getIPOName(row) === ipoName
        );


    const trend = [];


    rows.forEach(row => {

        const date =
            getRowDate(row);

        const gmp =
            getGMPPercent(row);


        if (
            date &&
            !isNaN(gmp)
        ) {

            trend.push({

                date: date,

                gmp: gmp

            });

        }

    });


    /*
       Sort oldest → newest for chart.
    */

    trend.sort(
        (a, b) =>
            a.date - b.date
    );


    /*
       Remove duplicate dates.

       If multiple records exist for
       same date, keep latest occurrence.
    */

    const unique = new Map();


    trend.forEach(item => {

        const key =
            item.date
                .toISOString()
                .split("T")[0];

        unique.set(key, item);

    });


    return [...unique.values()];

}


/* ============================================================
   UPDATE CHART
============================================================ */

function updateChart(ipoName) {

    const trend =
        getTrendData(ipoName);


    document.getElementById(
        "chartTitle"
    ).innerText =
        ipoName + " — GMP % Trend";


    const labels =
        trend.map(item =>
            formatDate(item.date)
        );


    const values =
        trend.map(item =>
            Number(item.gmp.toFixed(2))
        );


    const ctx =
        document.getElementById(
            "gmpChart"
        );


    /*
       Destroy previous chart
    */

    if (gmpChart) {

        gmpChart.destroy();

    }


    gmpChart =
        new Chart(ctx, {

            type: "line",

            data: {

                labels: labels,

                datasets: [{

                    label: "GMP %",

                    data: values,

                    tension: 0.25,

                    borderWidth: 2,

                    pointRadius: 4,

                    pointHoverRadius: 6,

                    fill: false

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                interaction: {

                    mode: "index",

                    intersect: false

                },

                plugins: {

                    legend: {

                        display: true

                    },

                    tooltip: {

                        callbacks: {

                            label: function(context) {

                                return (
                                    " GMP: " +
                                    context.parsed.y +
                                    "%"
                                );

                            }

                        }

                    }

                },

                scales: {

                    x: {

                        title: {

                            display: true,

                            text: "Date"

                        },

                        ticks: {

                            maxRotation: 45,

                            minRotation: 45

                        }

                    },

                    y: {

                        title: {

                            display: true,

                            text: "GMP %"

                        },

                        ticks: {

                            callback: function(value) {

                                return value + "%";

                            }

                        }

                    }

                }

            }

        });


    if (trend.length === 0) {

        document.getElementById(
            "status"
        ).innerText =
            "No date-wise GMP history available for " +
            ipoName;

    }

    else {

        document.getElementById(
            "status"
        ).innerText =
            `${ipoName}: ${trend.length} GMP history points plotted.`;

    }

}


/* ============================================================
   DEFAULT CHART
============================================================ */

function setupDefaultChart() {

    const select =
        document.getElementById(
            "ipoSelect"
        );


    if (select.value) {

        updateChart(
            select.value
        );

    }

}


/* ============================================================
   FORMAT DATE
============================================================ */

function formatDate(date) {

    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    return (
        day +
        "-" +
        month +
        "-" +
        date.getFullYear()
    );

}


/* ============================================================
   DISPLAY TABLE
============================================================ */

function displayTable(
    filterText = ""
) {

    const tbody =
        document.getElementById(
            "ipoTableBody"
        );


    tbody.innerHTML = "";


    const filtered =
        ipoData.filter(row => {

            const name =
                getIPOName(row)
                    .toLowerCase();


            return name.includes(
                filterText.toLowerCase()
            );

        });


    /*
       Latest updated/date first
    */

    filtered.sort((a, b) => {

        const dateA =
            getRowDate(a);

        const dateB =
            getRowDate(b);


        if (!dateA && !dateB) {
            return 0;
        }

        if (!dateA) {
            return 1;
        }

        if (!dateB) {
            return -1;
        }

        return dateB - dateA;

    });


    filtered.forEach(row => {

        const tr =
            document.createElement("tr");


        const name =
            getIPOName(row);


        const gmp =
            getValue(row, [
                "GMP",
                "GMP Numeric"
            ]);


        const gmpPercent =
            getGMPPercent(row);


        const down =
            getValue(row, [
                "GMP Down"
            ]);


        const up =
            getValue(row, [
                "GMP Up"
            ]);


        const subscription =
            getValue(row, [
                "Subscription",
                "SUB"
            ]);


        const price =
            getValue(row, [
                "IPO Price",
                "Price"
            ]);


        const size =
            getValue(row, [
                "IPO Size"
            ]);


        const lot =
            getValue(row, [
                "Lot Size",
                "LOT"
            ]);


        const open =
            getValue(row, [
                "Open"
            ]);


        const close =
            getValue(row, [
                "Close"
            ]);


        const boa =
            getValue(row, [
                "BOA Date",
                "BOA DT"
            ]);


        const listing =
            getValue(row, [
                "Listing Date",
                "LISTING"
            ]);


        const updated =
            getValue(row, [
                "Updated",
                "Updated-On",
                "UPDATED-ON"
            ]);


        const anchor =
            getValue(row, [
                "Anchor"
            ]);


        const estimated =
            getValue(row, [
                "Estimated Listing",
                "Estimated Listing Price"
            ]);


        tr.innerHTML = `

            <td>${escapeHTML(name)}</td>

            <td>${escapeHTML(gmp)}</td>

            <td>${isNaN(gmpPercent)
                ? "-"
                : gmpPercent.toFixed(2) + "%"
            }</td>

            <td>${escapeHTML(down)}</td>

            <td>${escapeHTML(up)}</td>

            <td>${escapeHTML(subscription)}</td>

            <td>${escapeHTML(price)}</td>

            <td>${escapeHTML(size)}</td>

            <td>${escapeHTML(lot)}</td>

            <td>${escapeHTML(open)}</td>

            <td>${escapeHTML(close)}</td>

            <td>${escapeHTML(boa)}</td>

            <td>${escapeHTML(listing)}</td>

            <td>${escapeHTML(updated)}</td>

            <td>${escapeHTML(anchor)}</td>

            <td>${escapeHTML(estimated)}</td>

        `;


        tbody.appendChild(tr);

    });

}


/* ============================================================
   GET VALUE
============================================================ */

function getValue(row, names) {

    const column =
        findColumn(row, names);


    if (column) {
        return row[column];
    }


    return "";

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ============================================================
   SEARCH
============================================================ */

document
    .getElementById("searchBox")
    .addEventListener(
        "input",
        function() {

            displayTable(
                this.value
            );

        }
    );


/* ============================================================
   START
============================================================ */

loadData();

</script>

</body>

</html>
