<html lang="en">

<head>

<meta charset="UTF-8">

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f4f6f9;

    color: #222;

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {

    width: 100%;

    max-width: 1500px;

    margin: auto;

    padding: 15px;

}


/* =========================================================
   HEADER
========================================================= */

.header {

    background: white;

    border-radius: 10px;

    padding: 18px;

    margin-bottom: 15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

}

.header h1 {

    margin: 0;

    font-size: 26px;

}

.header p {

    margin: 6px 0 0;

    color: #666;

}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    display: grid;

    grid-template-columns:
        minmax(250px, 1fr)
        minmax(250px, 1fr);

    gap: 12px;

    background: white;

    padding: 15px;

    border-radius: 10px;

    margin-bottom: 15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

}


.control-group {

    display: flex;

    flex-direction: column;

    gap: 6px;

}


.control-group label {

    font-weight: bold;

    font-size: 14px;

}


select,
input {

    width: 100%;

    padding: 10px;

    border: 1px solid #ccc;

    border-radius: 6px;

    font-size: 14px;

    background: white;

}


/* =========================================================
   CHART SECTION
========================================================= */

.chart-card {

    background: white;

    border-radius: 10px;

    padding: 15px;

    margin-bottom: 15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

}


.chart-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 10px;

}


.chart-header h2 {

    margin: 0;

    font-size: 19px;

}


.chart-info {

    font-size: 13px;

    color: #666;

}


.chart-container {

    position: relative;

    width: 100%;

    height: 280px;

}


#gmpChart {

    width: 100% !important;

    height: 100% !important;

}


/* =========================================================
   STATUS
========================================================= */

.status {

    background: white;

    border-radius: 8px;

    padding: 10px 15px;

    margin-bottom: 15px;

    font-size: 14px;

    color: #555;

}


/* =========================================================
   TABLE
========================================================= */

.table-card {

    background: white;

    border-radius: 10px;

    padding: 15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

}


.section-title {

    margin-top: 0;

    font-size: 20px;

}


.table-wrapper {

    width: 100%;

    overflow-x: auto;

    -webkit-overflow-scrolling: touch;

}


table {

    width: 100%;

    min-width: 1400px;

    border-collapse: collapse;

    font-size: 13px;

}


thead th {

    position: sticky;

    top: 0;

    background: #1f2937;

    color: white;

    padding: 10px 8px;

    text-align: left;

    white-space: nowrap;

}


tbody td {

    padding: 9px 8px;

    border-bottom: 1px solid #eee;

    white-space: nowrap;

}


tbody tr:hover {

    background: #f5f7fa;

}


/* =========================================================
   GMP COLORS
========================================================= */

.gmp-positive {

    color: #008000;

    font-weight: bold;

}


.gmp-negative {

    color: #d00000;

    font-weight: bold;

}


.gmp-zero {

    color: #777;

    font-weight: bold;

}


/* =========================================================
   IPO NAME
========================================================= */

.ipo-name {

    font-weight: bold;

    min-width: 220px;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 768px) {

    .container {

        padding: 8px;

    }


    .header {

        padding: 14px;

    }


    .header h1 {

        font-size: 20px;

    }


    .header p {

        font-size: 13px;

    }


    .controls {

        grid-template-columns: 1fr;

        padding: 12px;

    }


    .chart-card {

        padding: 10px;

    }


    .chart-header {

        flex-direction: column;

        align-items: flex-start;

    }


    .chart-header h2 {

        font-size: 17px;

    }


    .chart-info {

        font-size: 12px;

    }


    .chart-container {

        height: 230px;

    }


    .table-card {

        padding: 10px;

    }


    .section-title {

        font-size: 18px;

    }


    table {

        font-size: 12px;

    }

}


/* =========================================================
   VERY SMALL SCREEN
========================================================= */

@media (max-width: 480px) {

    .container {

        padding: 5px;

    }


    .header h1 {

        font-size: 18px;

    }


    .chart-container {

        height: 210px;

    }


    select,
    input {

        font-size: 13px;

        padding: 9px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================

<div class="header">

            <thead>

                    <th>Anchor</th>

</div>

<script>


/* =========================================================
   CONFIGURATION
========================================================= */


/*
   Change this URL to your CSV location.

   If using GitHub:

   https://raw.githubusercontent.com/
   rishib-beep/ipo-gmp-scraper/main/
   ipo_gmp_result.csv
*/

const CSV_URL =
    "https://raw.githubusercontent.com/rishib-beep/ipo-gmp-scraper/main/ipo_gmp_result.csv";


let ipoData = [];

let gmpChart = null;


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (let i = 0; i < text.length; i++) {

        const char = text[i];

        const next = text[i + 1];


        if (char === '"' && insideQuotes && next === '"') {

            value += '"';

            i++;

        }

        else if (char === '"') {

            insideQuotes = !insideQuotes;

        }

        else if (char === "," && !insideQuotes) {

            row.push(value.trim());

            value = "";

        }

        else if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (char === "\r" && next === "\n") {

                i++;

            }


            row.push(value.trim());

            value = "";


            if (row.some(x => x !== "")) {

                rows.push(row);

            }


            row = [];

        }

        else {

            value += char;

        }

    }


    if (value !== "" || row.length > 0) {

        row.push(value.trim());

        rows.push(row);

    }


    if (rows.length === 0) {

        return [];

    }


    const headers = rows[0];


    return rows.slice(1).map(r => {

        const obj = {};

        headers.forEach((h, i) => {

            obj[h] = r[i] || "";

        });

        return obj;

    });

}


/* =========================================================
   NUMBER EXTRACTION
========================================================= */

function numberValue(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return 0;

    }


    const match =
        String(value)
            .replace(/,/g, "")
            .match(/-?\d+(\.\d+)?/);


    return match
        ? parseFloat(match[0])
        : 0;

}


/* =========================================================
   GMP EXTRACTION
========================================================= */

function extractGMP(value) {

    if (!value) {

        return 0;

    }


    return numberValue(value);

}


/* =========================================================
   GMP % EXTRACTION
========================================================= */

function extractGMPPercent(row) {

    let value =
        row["GMP %"] ||
        row["GMP % (Website)"] ||
        row["Calculated GMP %"] ||
        row["GMP % (Calculated)"];


    if (value !== undefined && value !== "") {

        return numberValue(value);

    }


    const gmp =
        numberValue(row["GMP"]);


    const price =
        numberValue(
            row["IPO Price"] ||
            row["PRICE (₹)"]
        );


    if (price > 0) {

        return (gmp / price) * 100;

    }


    return 0;

}


/* =========================================================
   DATE PARSER
========================================================= */

function parseDate(value) {

    if (!value) {

        return null;

    }


    value = String(value).trim();


    /*
       Examples:

       27-Aug 23:37
       28-Aug 15:37
       28-Aug
    */


    const match =
        value.match(
            /(\d{1,2})[-\/]([A-Za-z]{3,9})(?:\s+(\d{1,2}):(\d{2}))?/
        );


    if (!match) {

        return null;

    }


    const day =
        parseInt(match[1]);


    const monthText =
        match[2].substring(0, 3).toLowerCase();


    const months = {

        jan: 0,

        feb: 1,

        mar: 2,

        apr: 3,

        may: 4,

        jun: 5,

        jul: 6,

        aug: 7,

        sep: 8,

        oct: 9,

        nov: 10,

        dec: 11

    };


    const month =
        months[monthText];


    if (month === undefined) {

        return null;

    }


    let year =
        new Date().getFullYear();


    /*
       If the date is in the future
       relative to today, it is probably
       from the previous year.
    */

    const now =
        new Date();


    let date =
        new Date(
            year,
            month,
            day,
            match[3]
                ? parseInt(match[3])
                : 0,
            match[4]
                ? parseInt(match[4])
                : 0
        );


    if (date > now) {

        date.setFullYear(year - 1);

    }


    return date;

}


/* =========================================================
   UPDATED DATE
========================================================= */

function getUpdatedDate(row) {

    return parseDate(
        row["Updated"] ||
        row["UPDATED-ON"] ||
        row["Updated On"]
    );

}


/* =========================================================
   SORT BY LATEST UPDATED
========================================================= */

function sortLatestFirst(data) {

    return data.sort(
        (a, b) => {

            const dateA =
                getUpdatedDate(a);

            const dateB =
                getUpdatedDate(b);


            if (!dateA && !dateB) {

                return 0;

            }


            if (!dateA) {

                return 1;

            }


            if (!dateB) {

                return -1;

            }


            return dateB - dateA;

        }
    );

}


/* =========================================================
   IPO NAME
========================================================= */

function getIPOName(row) {

    return (
        row["IPO Name"] ||
        row["Name"] ||
        row["IPO"] ||
        ""
    ).trim();

}


/* =========================================================
   DISPLAY TABLE
========================================================= */

function displayTable(data) {

    const tbody =
        document.getElementById(
            "ipoTableBody"
        );


    tbody.innerHTML = "";


    data.forEach(row => {


        const tr =
            document.createElement("tr");


        const gmp =
            extractGMP(row["GMP"]);


        const gmpPercent =
            extractGMPPercent(row);


        let gmpClass =
            "gmp-zero";


        if (gmp > 0) {

            gmpClass =
                "gmp-positive";

        }

        else if (gmp < 0) {

            gmpClass =
                "gmp-negative";

        }


        tr.innerHTML = `

            <td class="ipo-name">

                ${escapeHTML(
                    getIPOName(row)
                )}

            </td>

            <td class="${gmpClass}">

                ₹${gmp}

            </td>

            <td class="${gmpClass}">

                ${gmpPercent.toFixed(2)}%

            </td>

            <td>
                ${escapeHTML(
                    row["GMP Down"] ||
                    ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    row["GMP Up"] ||
                    ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    row["Subscription"] ||
                    ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    row["IPO Price"] ||
                    row["PRICE (₹)"] ||
                    ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    row["IPO Size"] ||
                    row["IPO SIZE"] ||
                    ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    row["Lot Size"] ||
                    row["LOT"] ||
                    ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    row["Open"] ||
                    row["OPEN"] ||
                    ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    row["Close"] ||
                    row["CLOSE"] ||
                    ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    row["BOA Date"] ||
                    row["BOA DT"] ||
                    ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    row["Listing Date"] ||
                    row["LISTING"] ||
                    ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    row["Updated"] ||
                    row["UPDATED-ON"] ||
                    ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    row["Anchor"] ||
                    row["ANCHOR"] ||
                    ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    row["Estimated Listing Price"] ||
                    row["Estimated Listing"] ||
                    ""
                )}
            </td>

        `;


        tbody.appendChild(tr);

    });


    document.getElementById("status")
        .textContent =
        `${data.length} IPO records loaded — sorted by latest update.`;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   CREATE IPO DROPDOWN
========================================================= */

function createDropdown(data) {

    const select =
        document.getElementById(
            "ipoSelect"
        );


    select.innerHTML = "";


    const defaultOption =
        document.createElement("option");


    defaultOption.value = "";


    defaultOption.textContent =
        "Select IPO for GMP Trend";


    select.appendChild(
        defaultOption
    );


    data.forEach((row, index) => {

        const option =
            document.createElement("option");


        option.value = index;


        option.textContent =
            getIPOName(row);


        select.appendChild(option);

    });

}


/* =========================================================
   SEARCH
========================================================= */

function setupSearch() {

    const search =
        document.getElementById(
            "searchBox"
        );


    search.addEventListener(
        "input",
        function () {

            const query =
                this.value
                    .toLowerCase()
                    .trim();


            const filtered =
                ipoData.filter(row => {

                    return getIPOName(row)
                        .toLowerCase()
                        .includes(query);

                });


            displayTable(filtered);

        }
    );

}


/* =========================================================
   EXTRACT GMP FROM OPEN / CLOSE
========================================================= */

function extractHistoricalGMP(value) {

    if (!value) {

        return null;

    }


    /*
       Examples:

       20-Aug GMP: 270
       24-Aug GMP: 313
       25-Aug
    */


    const match =
        String(value)
            .match(
                /GMP\s*:\s*(-?\d+(?:\.\d+)?)/i
            );


    if (!match) {

        return null;

    }


    return parseFloat(match[1]);

}


/* =========================================================
   GET OPEN DATE
========================================================= */

function getOpenDate(row) {

    const value =
        row["Open"] ||
        row["OPEN"] ||
        "";


    const match =
        String(value).match(
            /(\d{1,2})[-\/]([A-Za-z]{3,9})/
        );


    if (!match) {

        return null;

    }


    return parseDate(
        match[1] +
        "-" +
        match[2]
    );

}


/* =========================================================
   BUILD HISTORICAL GMP DATA
========================================================= */

function buildGMPHistory(row) {

    const history = [];


    /*
       Current GMP.

       Updated date becomes
       latest GMP observation.
    */

    const currentGMP =
        extractGMP(row["GMP"]);


    const currentDate =
        getUpdatedDate(row);


    const currentPercent =
        currentGMP /
        numberValue(
            row["IPO Price"] ||
            row["PRICE (₹)"]
        ) *
        100;


    /*
       OPEN historical GMP
    */

    const openValue =
        row["Open"] ||
        row["OPEN"] ||
        "";


    const openGMP =
        extractHistoricalGMP(
            openValue
        );


    const openDateMatch =
        String(openValue).match(
            /(\d{1,2})[-\/]([A-Za-z]{3,9})/
        );


    if (
        openGMP !== null &&
        openDateMatch
    ) {

        const date =
            parseDate(
                openDateMatch[1] +
                "-" +
                openDateMatch[2]
            );


        if (date) {

            const price =
                numberValue(
                    row["IPO Price"] ||
                    row["PRICE (₹)"]
                );


            history.push({

                date: date,

                gmp: openGMP,

                percent:
                    price > 0
                        ? openGMP /
                          price *
                          100
                        : 0

            });

        }

    }


    /*
       CLOSE historical GMP
    */

    const closeValue =
        row["Close"] ||
        row["CLOSE"] ||
        "";


    const closeGMP =
        extractHistoricalGMP(
            closeValue
        );


    const closeDateMatch =
        String(closeValue).match(
            /(\d{1,2})[-\/]([A-Za-z]{3,9})/
        );


    if (
        closeGMP !== null &&
        closeDateMatch
    ) {

        const date =
            parseDate(
                closeDateMatch[1] +
                "-" +
                closeDateMatch[2]
            );


        if (date) {

            const price =
                numberValue(
                    row["IPO Price"] ||
                    row["PRICE (₹)"]
                );


            history.push({

                date: date,

                gmp: closeGMP,

                percent:
                    price > 0
                        ? closeGMP /
                          price *
                          100
                        : 0

            });

        }

    }


    /*
       CURRENT GMP
    */

    if (
        currentDate &&
        !isNaN(currentPercent)
    ) {

        history.push({

            date: currentDate,

            gmp: currentGMP,

            percent:
                currentPercent

        });

    }


    /*
       Sort oldest → newest
    */

    history.sort(
        (a, b) =>
            a.date - b.date
    );


    /*
       Remove duplicate dates.

       If multiple GMP values exist
       on the same date, keep the
       latest/current value.
    */

    const map =
        new Map();


    history.forEach(item => {

        const key =
            item.date
                .toISOString()
                .substring(0, 10);


        map.set(
            key,
            item
        );

    });


    return Array.from(
        map.values()
    ).sort(
        (a, b) =>
            a.date - b.date
    );

}


/* =========================================================
   FILL CONTINUOUS DATES
========================================================= */

function makeContinuousHistory(
    history,
    row
) {

    if (
        history.length === 0
    ) {

        return [];

    }


    const result = [];


    const start =
        history[0].date;


    const end =
        new Date();


    /*
       Map existing GMP observations.
    */

    const map =
        new Map();


    history.forEach(item => {

        const key =
            item.date
                .toISOString()
                .substring(0, 10);


        map.set(
            key,
            item.percent
        );

    });


    let lastValue = null;


    const date =
        new Date(start);


    while (date <= end) {

        const key =
            date
                .toISOString()
                .substring(0, 10);


        if (map.has(key)) {

            lastValue =
                map.get(key);

        }


        /*
           Carry the last GMP forward.

           This creates the continuous
           GMP line between observations.
        */

        if (lastValue !== null) {

            result.push({

                date:
                    new Date(date),

                percent:
                    lastValue

            });

        }


        date.setDate(
            date.getDate() + 1
        );

    }


    return result;

}


/* =========================================================
   DISPLAY GMP CHART
========================================================= */

function displayChart(row) {

    const history =
        buildGMPHistory(row);


    const continuous =
        makeContinuousHistory(
            history,
            row
        );


    const title =
        document.getElementById(
            "chartTitle"
        );


    title.textContent =
        getIPOName(row) +
        " — GMP % Trend";


    if (gmpChart) {

        gmpChart.destroy();

        gmpChart = null;

    }


    const canvas =
        document.getElementById(
            "gmpChart"
        );


    const ctx =
        canvas.getContext("2d");


    if (
        continuous.length === 0
    ) {

        return;

    }


    const labels =
        continuous.map(
            item => {

                return item.date
                    .toLocaleDateString(
                        "en-IN",
                        {
                            day: "2-digit",
                            month: "short"
                        }
                    );

            }
        );


    const values =
        continuous.map(
            item =>
                Number(
                    item.percent.toFixed(2)
                )
        );


    gmpChart =
        new Chart(
            ctx,
            {

                type: "line",

                data: {

                    labels: labels,

                    datasets: [

                        {

                            label:
                                "GMP %",

                            data:
                                values,

                            tension:
                                0.25,

                            fill:
                                false,

                            pointRadius:
                                3,

                            pointHoverRadius:
                                5

                        }

                    ]

                },


                options: {

                    responsive: true,

                    maintainAspectRatio:
                        false,


                    interaction: {

                        mode:
                            "index",

                        intersect:
                            false

                    },


                    plugins: {

                        legend: {

                            display:
                                true

                        },


                        tooltip: {

                            callbacks: {

                                label:
                                    function(
                                        context
                                    ) {

                                        return (
                                            " GMP: " +
                                            context.parsed.y
                                                .toFixed(2) +
                                            "%"
                                        );

                                    }

                            }

                        }

                    },


                    scales: {

                        x: {

                            title: {

                                display:
                                    true,

                                text:
                                    "Date"

                            },

                            ticks: {

                                maxRotation:
                                    45,

                                minRotation:
                                    0

                            }

                        },


                        y: {

                            title: {

                                display:
                                    true,

                                text:
                                    "GMP %"

                            },

                            beginAtZero:
                                true,

                            ticks: {

                                callback:
                                    function(
                                        value
                                    ) {

                                        return (
                                            value +
                                            "%"
                                        );

                                    }

                            }

                        }

                    }

                }

            }

        );

}


/* =========================================================
   DROPDOWN EVENT
========================================================= */

document
    .getElementById("ipoSelect")
    .addEventListener(
        "change",
        function () {

            const index =
                this.value;


            if (
                index === ""
            ) {

                if (gmpChart) {

                    gmpChart.destroy();

                    gmpChart = null;

                }


                document
                    .getElementById(
                        "chartTitle"
                    )
                    .textContent =
                    "GMP % Trend";


                return;

            }


            const row =
                ipoData[
                    parseInt(index)
                ];


            displayChart(row);

        }
    );


/* =========================================================
   LOAD CSV
========================================================= */

async function loadData() {

    try {

        document
            .getElementById("status")
            .textContent =
            "Loading GMP data...";


        const response =
            await fetch(
                CSV_URL +
                "?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "CSV HTTP error: " +
                response.status
            );

        }


        const text =
            await response.text();


        ipoData =
            parseCSV(text);


        /*
           SORT LATEST UPDATED FIRST
        */

        ipoData =
            sortLatestFirst(
                ipoData
            );


        console.log(
            "Loaded IPO records:",
            ipoData.length
        );


        if (
            ipoData.length === 0
        ) {

            throw new Error(
                "No IPO records found."
            );

        }


        /*
           Create dropdown
        */

        createDropdown(
            ipoData
        );


        /*
           Display table
        */

        displayTable(
            ipoData
        );


        /*
           Automatically select
           first/latest IPO
        */

        const select =
            document.getElementById(
                "ipoSelect"
            );


        if (
            ipoData.length > 0
        ) {

            select.value = "0";


            displayChart(
                ipoData[0]
            );

        }


    }

    catch (error) {

        console.error(
            error
        );


        document
            .getElementById("status")
            .textContent =
            "Error loading IPO GMP data: " +
            error.message;

    }

}


/* =========================================================
   INITIALIZE
========================================================= */

setupSearch();

loadData();


</script>
